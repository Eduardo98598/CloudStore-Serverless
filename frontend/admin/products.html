<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Productos | CloudStore Admin</title>
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-wrapper">
    
    <!-- Barra Lateral -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-brand">
        <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
          <i class="bi bi-cloud-check-fill text-primary fs-4"></i>
          <div>
            <div class="brand-gradient fw-bold">CloudStore</div>
            <div class="text-secondary small" style="font-size: 0.65rem;">PANEL DE CONTROL</div>
          </div>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-heading">Principal</div>
        <a href="index.html" class="sidebar-link">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>

        <div class="sidebar-heading">Gestión Comercial</div>
        <a href="products.html" class="sidebar-link active">
          <i class="bi bi-box-seam"></i> Productos
        </a>
        <a href="product-form.html" class="sidebar-link">
          <i class="bi bi-plus-circle"></i> Nuevo Producto
        </a>
        <a href="categories.html" class="sidebar-link">
          <i class="bi bi-tags"></i> Categorías
        </a>
        <a href="orders.html" class="sidebar-link">
          <i class="bi bi-receipt"></i> Pedidos
        </a>

        <div class="sidebar-heading">Acceso</div>
        <a href="../index.html" class="sidebar-link" target="_blank">
          <i class="bi bi-box-arrow-up-right"></i> Ver Tienda Pública
        </a>
      </nav>
    </aside>

    <!-- Contenido Principal -->
    <div class="admin-main">
      
      <!-- Topbar -->
      <header class="admin-topbar d-flex align-items-center justify-content-between px-4">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-custom d-lg-none" id="sidebarToggle">
            <i class="bi bi-list fs-5"></i>
          </button>
          <h5 class="fw-bold text-dark mb-0">Catálogo de Productos</h5>
        </div>

        <a href="product-form.html" class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm">
          <i class="bi bi-plus-lg me-1"></i> Crear Producto
        </a>
      </header>

      <!-- Contenido -->
      <main class="admin-content">
        
        <!-- Barra de Filtros -->
        <div class="admin-card p-3 mb-4">
          <div class="row g-3 align-items-center">
            
            <!-- Búsqueda -->
            <div class="col-md-5">
              <div class="input-group">
                <span class="input-group-text bg-light border text-secondary"><i class="bi bi-search"></i></span>
                <input type="text" id="adminProductSearch" class="form-control" placeholder="Buscar por nombre, SKU o categoría...">
              </div>
            </div>

            <!-- Filtro de Categoría -->
            <div class="col-md-4">
              <select id="adminCategoryFilter" class="form-select">
                <option value="all">Todas las categorías</option>
                <!-- Opciones dinámicas -->
              </select>
            </div>

            <!-- Filtro de Estado -->
            <div class="col-md-3">
              <select id="adminStatusFilter" class="form-select">
                <option value="all">Todos los estados</option>
                <option value="active">Activos únicamente</option>
                <option value="inactive">Inactivos / Desactivados</option>
              </select>
            </div>

          </div>
        </div>

        <!-- Tabla de Productos -->
        <div class="admin-card">
          <div class="admin-card-header">
            <div>
              <h6 class="fw-bold text-dark mb-0">Listado de Productos</h6>
              <span class="text-secondary small">Total encontrados: <span id="adminProductsCount" class="text-primary fw-bold">0</span></span>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-admin align-middle">
              <thead>
                <tr>
                  <th>Producto</th>
                  <th>Categoría</th>
                  <th>Precio</th>
                  <th>Stock</th>
                  <th>Estado</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="adminProductsTableBody">
                <tr>
                  <td colspan="6" class="text-center py-5 text-secondary">
                    <div class="spinner-border text-primary spinner-border-sm me-2"></div> Cargando productos...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../config/store.config.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Toggle sidebar móvil
      const sidebar = document.getElementById('adminSidebar');
      const toggleBtn = document.getElementById('sidebarToggle');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => sidebar.classList.toggle('show'));
      }

      const tbody = document.getElementById('adminProductsTableBody');
      const countEl = document.getElementById('adminProductsCount');
      const searchInput = document.getElementById('adminProductSearch');
      const catSelect = document.getElementById('adminCategoryFilter');
      const statusSelect = document.getElementById('adminStatusFilter');

      // Cargar categorías en el select
      const catRes = await API.getCategories({ includeInactive: true });
      if (catRes.success && catRes.data) {
        catRes.data.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.name;
          catSelect.appendChild(opt);
        });
      }

      async function loadProducts() {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="text-center py-4 text-secondary">
              <div class="spinner-border spinner-border-sm text-primary me-2"></div> Actualizando productos...
            </td>
          </tr>
        `;

        const filters = {
          search: searchInput.value.trim(),
          categoryId: catSelect.value,
          status: statusSelect.value
        };

        const res = await API.getAdminProducts(filters);
        if (!res.success || !res.data) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">Error al cargar productos</td></tr>`;
          return;
        }

        const products = res.data;
        countEl.textContent = products.length;

        if (products.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="text-center py-5 text-secondary">
                No se encontraron productos con los filtros seleccionados.
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = products.map(prod => {
          const isOutOfStock = prod.stock <= 0;
          const isLowStock = prod.stock > 0 && prod.stock <= 4;
          const stockBadgeClass = isOutOfStock ? 'bg-danger' : isLowStock ? 'bg-warning text-dark' : 'bg-success bg-opacity-20 text-success border border-success border-opacity-25';

          return `
            <tr>
              <td>
                <div class="d-flex align-items-center gap-3">
                  <img 
                    src="${prod.image}" 
                    alt="${prod.name}" 
                    class="product-thumb-sm rounded"
                    onerror="this.src='https://images.unsplash.com/photo-1526738549149-8e07eca6c147?auto=format&fit=crop&w=100&q=80';"
                  >
                  <div>
                    <div class="fw-bold text-dark mb-0">${prod.name}</div>
                    <div class="text-secondary small font-monospace">${prod.id}</div>
                  </div>
                </div>
              </td>
              <td>
                <span class="badge bg-light text-secondary border px-2.5 py-1">
                  ${prod.categoryName || 'Sin categoría'}
                </span>
              </td>
              <td>
                <div class="fw-bold text-dark">${UI.formatCurrency(prod.price)}</div>
                ${prod.comparePrice ? `<div class="text-decoration-line-through text-muted small">${UI.formatCurrency(prod.comparePrice)}</div>` : ''}
              </td>
              <td>
                <span class="badge ${stockBadgeClass} fw-semibold px-2 py-1">
                  ${prod.stock} unid.
                </span>
              </td>
              <td>
                <div class="form-check form-switch mb-0">
                  <input 
                    class="form-check-input status-toggle" 
                    type="checkbox" 
                    role="switch" 
                    data-id="${prod.id}" 
                    ${prod.active ? 'checked' : ''}
                    title="${prod.active ? 'Desactivar' : 'Activar'}"
                  >
                  <label class="form-check-label small ${prod.active ? 'text-success fw-semibold' : 'text-secondary'}">
                    ${prod.active ? 'Activo' : 'Inactivo'}
                  </label>
                </div>
              </td>
              <td class="text-end">
                <div class="btn-group btn-group-sm">
                  <a href="../product.html?id=${prod.id}" target="_blank" class="btn btn-outline-secondary" title="Ver en tienda pública">
                    <i class="bi bi-box-arrow-up-right"></i>
                  </a>
                  <a href="product-form.html?id=${prod.id}" class="btn btn-outline-secondary" title="Editar producto">
                    <i class="bi bi-pencil"></i>
                  </a>
                  <button type="button" class="btn btn-outline-danger btn-delete-product" data-id="${prod.id}" data-name="${prod.name}" title="Eliminar producto">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');

        attachRowEvents();
      }

      function attachRowEvents() {
        // Toggle Switch de Estado Activo/Inactivo
        tbody.querySelectorAll('.status-toggle').forEach(sw => {
          sw.addEventListener('change', async (e) => {
            const id = sw.dataset.id;
            const res = await API.toggleProductStatus(id);
            if (res.success) {
              UI.showToast(`Producto ${res.data.active ? 'activado' : 'desactivado'} con éxito`, 'info');
              loadProducts();
            } else {
              UI.showToast(res.error || 'Error al cambiar estado', 'danger');
              sw.checked = !sw.checked;
            }
          });
        });

        // Eliminar Producto
        tbody.querySelectorAll('.btn-delete-product').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            const name = btn.dataset.name;

            const confirmed = await UI.confirm(
              'Eliminar Producto',
              `¿Estás seguro de que deseas eliminar permanentemente el producto <strong>"${name}"</strong>?`,
              'Eliminar',
              true
            );

            if (confirmed) {
              const res = await API.deleteProduct(id);
              if (res.success) {
                UI.showToast('Producto eliminado exitosamente', 'success');
                loadProducts();
              } else {
                UI.showToast(res.error || 'Error al eliminar producto', 'danger');
              }
            }
          });
        });
      }

      // Event listeners para filtros
      let searchTimeout;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(loadProducts, 250);
      });
      catSelect.addEventListener('change', loadProducts);
      statusSelect.addEventListener('change', loadProducts);

      // Carga inicial
      loadProducts();
    });
  </script>
</body>
</html>
